spring.application.name=acta-pg-api

server.port=8080

spring.jackson.time-zone=America/Sao_Paulo

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

acta.auth-api.url=${ACTA_AUTH_API_URL:http://localhost:8081}
acta.auth-api.connect-timeout=${ACTA_AUTH_API_CONNECT_TIMEOUT:2s}
acta.auth-api.read-timeout=${ACTA_AUTH_API_READ_TIMEOUT:3s}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

acta.fcm-api.url=${ACTA_FCM_API_URL:http://localhost:8000}
acta.fcm-api.internal-token=${ACTA_FCM_INTERNAL_TOKEN:}